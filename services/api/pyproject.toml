[project]
name = "anypath-api"
version = "0.1.0"
description = "Anypath backend (FastAPI) — route optimization service"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "timing: wall-clock performance assertions (SPEC: 15 points < 1.5 s)",
]
